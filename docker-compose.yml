services:
  backend:
    container_name: finanzas_backend
    build: ./backend
    environment:
      - FINANZAS_ADMIN_USERNAME=${FINANZAS_ADMIN_USERNAME:-admin}
      - FINANZAS_ADMIN_PASSWORD=${FINANZAS_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./backend/data:/app/data
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    container_name: finanzas_frontend
    build: ./mobile
    networks:
      - proxy
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  proxy:
    external: true
