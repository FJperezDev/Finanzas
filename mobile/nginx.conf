server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Acepta datasets grandes (guardado del Excel) y avatares en base64.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Archivos subidos (avatares de contacto) servidos desde el volumen
    # compartido con el backend. ^~ evita que el regex de estáticos los capture.
    location ^~ /media/ {
        alias /data/media/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API de Django (mismo origen que el frontend)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta del cliente recae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Activos estáticos con caché larga
    location ~* \.(js|css|png|ico|svg|ttf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
